<div class="d-flex align-items-center ms-auto" style="gap: 8px;">

  <form method="get" action="/shop/search/"
        class="d-flex align-items-center m-0 p-0">
    <input name="search"
           class="form-control"
           style="width: 160px; margin-right: 6px;"
           placeholder="Search"
           aria-label="Search">
    <button class="btn btn-outline-success"
            type="submit">Search</button>
  </form>

  <button type="button"
          id="abcd"
          class="btn btn-primary flex-shrink-0"
          style="white-space: nowrap; margin-left: 6px;"
          data-bs-toggle="popover"
          data-bs-html="true"
          data-bs-placement="bottom"
          title="Shopping Cart"
          data-bs-content='
            <div class="text-center">
              <p class="mb-2">Cart Total: <strong>$99</strong></p>
              <div class="d-flex gap-2 justify-content-center">
                <a href="{% url "clear_cart" %}" class="btn btn-danger btn-sm">Clear Cart</a>
                <a href="{% url "checkout" %}" class="btn btn-success btn-sm">Checkout</a>
              </div>
            </div>'>
    Cart (<span id="cart"></span>)
  </button>

</div>

<!-- Replace your broken script tag with this -->




    <!-- ✅ Bootstrap 5 JS Bundle (includes Popper — no separate Popper needed) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"  crossorigin="anonymous"></script>

    <!-- ✅ Bootstrap 5 requires manual popover initialization -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'));
        popoverTriggerList.forEach(function (el) {
          new bootstrap.Popover(el);
        });
      });
    </script>

    <!-- ✅ Bootstrap 5 requires manual popover initialization -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'));
        popoverTriggerList.forEach(function (el) {
          new bootstrap.Popover(el);
        });
      });



// ── Cart Initialize ──────────────────────────────────────────────────────────
var cart = {};

if (localStorage.getItem('cart') !== null) {
    try {
        cart = JSON.parse(localStorage.getItem('cart'));
        // Validate cart structure — wipe if corrupted
        for (var key in cart) {
            if (
                !Array.isArray(cart[key]) ||
                cart[key].length < 3 ||
                typeof cart[key][0] !== 'number'
            ) {
                console.warn('Corrupted cart found, clearing localStorage');
                localStorage.clear();
                cart = {};
                break;
            }
        }
    } catch(e) {
        localStorage.clear();
        cart = {};
    }
}





// ── Update Cart Display ──────────────────────────────────────────────────────
function updateCartDisplay(cart) {

    var sum = 0;

    for (var item in cart) {

        var qty  = cart[item][0];   // number
        var name = cart[item][1];   // string
   var itemPrice = parseFloat(cart[item][2]);
        sum += qty;

        var a     = item.slice(2);  // strips 'pr' → gives product_id number
        var divEl = document.getElementById('divpr' + a);

        if (divEl) {
            divEl.innerHTML =
                "<button id='minuspr" + a + "' class='btn btn-sm btn-danger minus'>-</button>" +
                " <span id='valpr"   + a + "'>" + qty + "</span> " +
                "<button id='pluspr" + a + "' class='btn btn-sm btn-success plus'>+</button>";
        }
    }

    localStorage.setItem('cart', JSON.stringify(cart));

    var cartEl = document.getElementById('cart');
    if (cartEl) {
        cartEl.innerHTML = sum;
    }
}









// ── Update Popover ───────────────────────────────────────────────────────────
function updatePopover(cart) {

    var popStr =
        "<h5>Items in your shopping cart</h5>" +
        "<div class='mx-2 my-2'>";

    var i = 1;

    for (var item in cart) {

        var qty      = cart[item][0];
        var name     = cart[item][1];

        var nameEl   = document.getElementById('name' + item);
        var itemName = nameEl ? nameEl.innerHTML.trim().slice(0, 19) : name;

        popStr += "<b>" + i + "</b>. " + itemName + "... Qty: " + qty + "<br>";
        i++;
    }

    popStr +=
        "</div>" +
        "<a href='/shop/checkout'>" +
        "<button class='btn btn-primary btn-sm' id='checkout'>Checkout</button></a> " +
        "<button class='btn btn-danger btn-sm' onclick='clearCart()' id='clearCart'>Clear Cart</button>";

    var el = document.getElementById('popcart');

    if (el) {
        el.setAttribute('data-bs-content', popStr);

        var existingPopover = bootstrap.Popover.getInstance(el);
        if (existingPopover) {
            existingPopover.setContent({ '.popover-body': popStr });
        }
    }
}


// ── Add To Cart ──────────────────────────────────────────────────────────────
$(document).on('click', '.divpr button.cart', function () {

    var idstr = this.id.toString();  // e.g. 'pr14'

    if (cart[idstr] != undefined) {
        // Increment only [0] (qty), keep [1] (name) intact
        cart[idstr][0] = cart[idstr][0] + 1;
    } else {
        // Get actual product name from DOM for new cart entry
        var nameEl   = document.getElementById('name' + idstr);
        var itemName = nameEl ? nameEl.innerHTML.trim() : idstr;
             var price    = parseFloat($(this).data('price'));

           cart[idstr]  = [1, itemName, price];

    }

    updateCartDisplay(cart);
    updatePopover(cart);

});

















updateCartDisplay(cart);
updatePopover(cart);



    </script>
